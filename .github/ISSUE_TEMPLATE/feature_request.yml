name: Feature request / 功能建议
description: Describe a useful improvement / 描述值得改进的功能
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case / 问题与场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望功能
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints / 替代方案与限制
