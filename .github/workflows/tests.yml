name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.10'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: macos-15, python: '3.12'}
          - {os: windows-2025, python: '3.12'}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra pdf
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-wqy-microhei
      - name: Test core, HTTP API and reports
        env:
          PDF_REQUIRE_FONT: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: uv run --locked --extra dev --extra pdf pytest -q
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.12'
      - run: uv sync --locked --extra release
      - run: uv run --locked --extra release python -m build
      - run: uv run --locked --extra release python -m twine check dist/*.whl dist/*.tar.gz
      - name: Smoke-test an isolated wheel installation
        shell: bash
        run: |
          uv venv .wheel-test
          uv pip install --python .wheel-test/bin/python dist/*.whl
          .wheel-test/bin/photo-locate --version
          .wheel-test/bin/photo-locate demo --case cases/ci-demo
          .wheel-test/bin/photo-locate check cases/ci-demo
          .wheel-test/bin/python -c "from importlib.resources import files; from photo_location_workflow.ui import create_server; assert all(files('photo_location_workflow').joinpath('static', name).is_file() for name in ('app.js', 'comparison.js', 'style.css', 'index.html')); server, _ = create_server('cases'); server.server_close()"
